name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan files and history
        run: |
          gitleaks dir . --no-banner --redact
          gitleaks git . --no-banner --redact
      - name: Check shell scripts parse
        run: for f in setup.sh scripts/*.sh; do bash -n "$f"; done
